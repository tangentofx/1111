<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>8-Ball Pool Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap');
        
        body { 
            margin: 0; padding: 0; background: radial-gradient(circle at center, #1a1e29 0%, #080a0f 100%); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden; touch-action: none; font-family: 'Montserrat', sans-serif; color: white; 
        }
        
        .hud { display: flex; justify-content: space-between; width: 360px; margin-bottom: 15px; align-items: center; }
        .turn-badge {
            background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; 
            font-size: 11px; font-weight: 800; letter-spacing: 1.5px; 
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: all 0.3s;
        }
        #turn-text.active { color: #00e676; border-color: #00e676; }

        .table-wrap {
            width: 360px; height: 640px; background: radial-gradient(circle, #2a7b48 0%, #114022 100%); 
            border: 22px solid #362210; border-radius: 24px; position: relative; 
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.9);
            border-image: linear-gradient(to bottom, #4a3018, #2a1a0c) 1;
        }
        .table-wrap::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9); pointer-events: none; z-index: 5;
        }

        .pocket {
            position: absolute; width: 46px; height: 46px; background: #000; border-radius: 50%;
            box-shadow: inset 0 5px 15px rgba(255,255,255,0.15), inset 0 -5px 15px rgba(0,0,0,1);
            transform: translate(-50%, -50%); z-index: 1; border: 2px solid #22150a;
        }

        #aim-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .ball {
            position: absolute; width: 24px; height: 24px; border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 3;
            box-shadow: -3px -3px 8px rgba(0,0,0,0.7) inset, 2px 2px 8px rgba(255,255,255,0.6) inset, 3px 5px 10px rgba(0,0,0,0.7);
        }
        #cue-ball { background: radial-gradient(circle at 35% 35%, #ffffff, #d4d4d4); }
        #eight-ball { background: radial-gradient(circle at 35% 35%, #444, #000); display: flex; align-items: center; justify-content: center; }
        #eight-ball::after { content: "8"; background: #fff; color: #000; width: 12px; height: 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; box-shadow: inset 0px 0px 2px rgba(0,0,0,0.5); }

        .pocketed { transform: translate(-50%, -50%) scale(0) !important; opacity: 0 !important; transition: all 0.4s cubic-bezier(0.55, 0.085, 0.68, 0.53) !important; }
        .jumpscare { position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) scale(150) !important; z-index: 9999 !important; opacity: 1 !important; transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1) !important; }

        .power-container { width: 360px; height: 10px; background: #0a0a0a; border-radius: 5px; margin-top: 25px; border: 2px solid #222; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        .power-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00e676, #ffea00, #ff1744); transition: width 0.05s linear; }

        #proposal-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 1); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 1.5s ease-in-out; z-index: 10000; color: white;}
        #proposal-screen.visible { opacity: 1; pointer-events: all; }
        .magic-8-ball { width: 280px; height: 280px; background-color: #111; border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: -10px -10px 40px rgba(255,255,255,0.05) inset, 10px 10px 40px rgba(0,0,0,0.9); animation: shake 1.5s ease-in-out 1s forwards; opacity: 0; transform: scale(0.5); transition: all 1s ease-in-out; }
        .magic-8-ball.reveal { opacity: 1; transform: scale(1); }
        .fortune-window { width: 130px; height: 130px; background-color: #000; border-radius: 50%; border: 6px solid #1a1a1a; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 2s ease-in-out 2.5s; box-shadow: inset 0 0 20px rgba(0,0,0,1); }
        .magic-8-ball.reveal .fortune-window { opacity: 1; }
        .triangle { width: 0; height: 0; border-left: 50px solid transparent; border-right: 50px solid transparent; border-top: 90px solid #1e3a8a; position: relative; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 0 10px rgba(30, 58, 138, 0.5));}
        .message { position: absolute; top: -75px; left: -45px; width: 90px; text-align: center; color: #fff; font-size: 14px; font-weight: 800; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); }
        .answers { margin-top: 50px; opacity: 0; transition: opacity 1s ease-in-out 4s; display: flex; gap: 15px;}
        .magic-8-ball.reveal ~ .answers { opacity: 1; }
        .answer-btn { background-color: #00e676; color: #000; padding: 15px 35px; font-size: 16px; border: none; border-radius: 30px; cursor: pointer; font-weight: 800; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px;}
        .answer-btn:hover { background-color: #00c853; transform: scale(1.05); }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
</head>
<body>

    <div class="hud">
        <div class="turn-badge active" id="turn-text">PULL TO SHOOT</div>
        <div class="turn-badge">8-BALL</div>
    </div>
    
    <div class="table-wrap" id="pool-table">
        <div class="pocket" style="left: 20px; top: 20px;"></div>
        <div class="pocket" style="left: 340px; top: 20px;"></div>
        <div class="pocket" style="left: 20px; top: 320px;"></div>
        <div class="pocket" style="left: 340px; top: 320px;"></div>
        <div class="pocket" style="left: 20px; top: 620px;"></div>
        <div class="pocket" style="left: 340px; top: 620px;"></div>

        <canvas id="aim-canvas"></canvas>
        <div id="cue-ball" class="ball"></div>
        <div id="eight-ball" class="ball"></div>
    </div>

    <div class="power-container">
        <div class="power-fill" id="power-fill"></div>
    </div>

    <div id="proposal-screen">
        <div class="magic-8-ball" id="magic-ball">
            <div class="fortune-window">
                <div class="triangle">
                    <div class="message">Will you go out with me?</div>
                </div>
            </div>
        </div>
        <div class="answers">
            <button class="answer-btn" onclick="alert('Yay! ❤️')">Yes</button>
            <button class="answer-btn" onclick="alert('I knew it! ❤️')">Absolutely</button>
        </div>
    </div>

<script>
    const socket = io();
    
    // --- ON-BOARD WEB AUDIO SYNTHESIZER ---
    // (Bypasses all browser blocking and missing file errors)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    // Wake up audio engine the second they touch the screen
    document.addEventListener('pointerdown', initAudio, { once: true });

    function playSound(type, vol = 1.0) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        if (type === 'strike') {
            // A deep thud
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.start(t);
            osc.stop(t + 0.2);
        } 
        else if (type === 'click') {
            // A sharp clack for balls hitting
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, t);
            osc.frequency.exponentialRampToValueAtTime(300, t + 0.03);
            gain.gain.setValueAtTime(vol * 0.8, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.03);
            osc.start(t);
            osc.stop(t + 0.03);
        }
        else if (type === 'hole') {
            // Ball dropping into a pocket
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, t);
            osc.frequency.exponentialRampToValueAtTime(50, t + 0.4);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
            osc.start(t);
            osc.stop(t + 0.4);
        }
        else if (type === 'jumpscare') {
            // Terrifying, loud, dissonant horror blast
            const freqs = [200, 215, 250, 440, 470, 800, 850];
            freqs.forEach(f => {
                let o = audioCtx.createOscillator();
                let g = audioCtx.createGain();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(f, t);
                o.frequency.linearRampToValueAtTime(f - 20, t + 2.5);
                g.gain.setValueAtTime(0.6, t); // Pushed hard to distort intentionally
                g.gain.exponentialRampToValueAtTime(0.01, t + 2.5);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(t);
                o.stop(t + 2.5);
            });
            // White Noise Roar
            const bufferSize = audioCtx.sampleRate * 2.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(1.5, t);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 2.5);
            noise.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(t);
        }
    }

    // --- PHYSICS ENGINE ---
    const Engine = Matter.Engine, Runner = Matter.Runner, 
          Bodies = Matter.Bodies, Composite = Matter.Composite, Events = Matter.Events;
    
    const engine = Engine.create();
    engine.gravity.y = 0; 
    engine.positionIterations = 10; 
    engine.velocityIterations = 10;

    const wallOptions = { isStatic: true, restitution: 0.85, label: 'wall' };
    Composite.add(engine.world, [
        Bodies.rectangle(180, -11, 360, 22, wallOptions), 
        Bodies.rectangle(180, 651, 360, 22, wallOptions), 
        Bodies.rectangle(-11, 320, 22, 640, wallOptions), 
        Bodies.rectangle(371, 320, 22, 640, wallOptions)  
    ]);

    const pocketOptions = { isStatic: true, isSensor: true, label: 'pocket' };
    const pockets = [
        Bodies.circle(20, 20, 22, pocketOptions), Bodies.circle(340, 20, 22, pocketOptions),
        Bodies.circle(20, 320, 20, pocketOptions), Bodies.circle(340, 320, 20, pocketOptions),
        Bodies.circle(20, 620, 22, pocketOptions), Bodies.circle(340, 620, 22, pocketOptions)
    ];
    Composite.add(engine.world, pockets);

    const ballOptions = { frictionAir: 0.012, restitution: 0.9, density: 0.02 };

    let cueBall = Bodies.circle(180, 490, 12, { ...ballOptions, label: 'cueball' });
    let eightBall = Bodies.circle(180, 150, 12, { ...ballOptions, label: '8ball' });
    Composite.add(engine.world, [cueBall, eightBall]);

    const runner = Runner.create();
    Runner.run(runner, engine);

    const aimCanvas = document.getElementById('aim-canvas');
    const ctx = aimCanvas.getContext('2d');
    const scale = window.devicePixelRatio || 1;
    aimCanvas.width = 360 * scale;
    aimCanvas.height = 640 * scale;
    ctx.scale(scale, scale);

    let stopDomSync = false; 

    Events.on(engine, 'afterUpdate', () => {
        if(stopDomSync) return;
        document.getElementById('cue-ball').style.left = cueBall.position.x + 'px';
        document.getElementById('cue-ball').style.top = cueBall.position.y + 'px';
        document.getElementById('eight-ball').style.left = eightBall.position.x + 'px';
        document.getElementById('eight-ball').style.top = eightBall.position.y + 'px';
    });

    let isAiming = false;
    let initialTouchX = 0, initialTouchY = 0;
    const tableElement = document.getElementById('pool-table');
    const powerFill = document.getElementById('power-fill');
    const turnText = document.getElementById('turn-text');

    tableElement.addEventListener('pointerdown', (e) => {
        if(stopDomSync) return;
        initAudio(); // Ensures sound is ready
        isAiming = true;
        const rect = tableElement.getBoundingClientRect();
        initialTouchX = e.clientX - rect.left;
        initialTouchY = e.clientY - rect.top;
    });

    tableElement.addEventListener('pointermove', (e) => {
        if (!isAiming) return;
        const rect = tableElement.getBoundingClientRect();
        const dragX = (e.clientX - rect.left) - initialTouchX;
        const dragY = (e.clientY - rect.top) - initialTouchY;
        const distance = Math.hypot(dragX, dragY);
        const maxPull = 160; 
        const clampedDist = Math.min(distance, maxPull);

        powerFill.style.width = (clampedDist / maxPull) * 100 + '%';
        ctx.clearRect(0, 0, 360, 640);

        if (distance > 5) {
            const angle = Math.atan2(dragY, dragX);
            const aimLength = 120 + clampedDist; 
            const targetX = cueBall.position.x - Math.cos(angle) * aimLength;
            const targetY = cueBall.position.y - Math.sin(angle) * aimLength;

            ctx.beginPath();
            ctx.moveTo(cueBall.position.x, cueBall.position.y);
            ctx.lineTo(targetX, targetY);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
            ctx.lineWidth = 1.5;
            ctx.setLineDash([6, 6]);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(targetX, targetY, 12, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
            ctx.fill();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
            ctx.lineWidth = 1;
            ctx.setLineDash([]);
            ctx.stroke();
        }
    });

    tableElement.addEventListener('pointerup', (e) => {
        if (!isAiming) return;
        isAiming = false;
        ctx.clearRect(0, 0, 360, 640);
        
        const rect = tableElement.getBoundingClientRect();
        const dragX = (e.clientX - rect.left) - initialTouchX;
        const dragY = (e.clientY - rect.top) - initialTouchY;
        const distance = Math.hypot(dragX, dragY);

        if (distance > 10) {
            const angle = Math.atan2(dragY, dragX);
            const power = Math.min(distance, 160) * 0.0008; 

            const forceX = -Math.cos(angle) * power;
            const forceY = -Math.sin(angle) * power;

            Matter.Body.applyForce(cueBall, cueBall.position, { x: forceX, y: forceY });
            socket.emit('shoot', { x: forceX, y: forceY });

            playSound('strike');
            turnText.innerText = "WAITING FOR OPPONENT";
            turnText.classList.remove('active');
        }
        powerFill.style.width = '0%';
    });

    socket.on('opponentShot', (force) => {
        playSound('strike');
        Matter.Body.applyForce(cueBall, cueBall.position, force);
        turnText.innerText = "YOUR TURN";
        turnText.classList.add('active');
    });

    let jumpscareTriggered = false;

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach((pair) => {
            const isPocket = pair.bodyA.label === 'pocket' || pair.bodyB.label === 'pocket';
            const ball = pair.bodyA.label === 'pocket' ? pair.bodyB : pair.bodyA;

            // 1. Play Collision Sounds
            if (!isPocket) {
                let relVel = Matter.Vector.magnitude(Matter.Vector.sub(pair.bodyA.velocity, pair.bodyB.velocity));
                if (relVel > 0.5) playSound('click', relVel / 15);
            }

            // 2. Pocket Logic
            if (isPocket) {
                
                // Cue Ball Scratch
                if (ball.label === 'cueball') {
                    playSound('hole');
                    const cEl = document.getElementById('cue-ball');
                    cEl.classList.add('pocketed');
                    Matter.Body.setVelocity(cueBall, { x: 0, y: 0 });
                    Matter.Body.setStatic(cueBall, true);

                    setTimeout(() => {
                        Matter.Body.setPosition(cueBall, { x: 180, y: 490 });
                        Matter.Body.setStatic(cueBall, false);
                        cEl.classList.remove('pocketed');
                    }, 1000); 
                }

                // THE JUMPSCARE SEQUENCE (8-Ball)
                if (ball.label === '8ball' && !jumpscareTriggered) {
                    jumpscareTriggered = true;
                    stopDomSync = true;
                    playSound('hole');
                    
                    const el = document.getElementById('eight-ball');
                    Matter.Body.setVelocity(eightBall, { x: 0, y: 0 });
                    Matter.Body.setStatic(eightBall, true);
                    
                    el.classList.add('pocketed'); 

                    setTimeout(() => {
                        playSound('jumpscare');
                        el.classList.remove('pocketed');
                        el.classList.add('jumpscare'); 

                        setTimeout(() => {
                            document.getElementById('proposal-screen').classList.add('visible');
                            document.getElementById('magic-ball').classList.add('reveal');
                        }, 250); 
                    }, 800); 
                }
            }
        });
    });
</script>
</body>
</html>
